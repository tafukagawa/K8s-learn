_format_version: "3.0"
services:
  - name: api-service
    url: http://k8s-learning-app-api
    routes:
      - name: api-route
        hosts: 
          - k8s-learning-app-api.localhost
        paths:
          - /
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 5
          policy: local
      - name: key-auth
      - name: request-transformer
        config:
          add:
            headers:
               - "X-Kong-Gateway:true"
      - name: response-transformer
        config:
          add:
            headers: 
              - "X-Powered-By:Kong-APIGW"
  - name: ui-service
    url: http://k8slearning-app-ui
    routes:
      - name: ui-route
        hosts:
          - k8s-learning-app-ui.localhost
        paths:
          - /
        strip_path: false

consumers:
  - username: demo-user
    keyauth_credentials:
      - key: demo-api-key-12345